name: TelePro 15-Min ETP Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install playwright ddddocr "Pillow<10"
          playwright install chromium
          playwright install-deps chromium

      - name: Cache TelePro Session Cookie
        uses: actions/cache@v4
        with:
          path: session_cookie.txt
          key: telepro-session-${{ github.run_id }}
          restore-keys: |
            telepro-session-

      - name: Run TelePro Monitor
        env:
          TELEPRO_USER: ${{ secrets.TELEPRO_USER }}
          TELEPRO_PASS: ${{ secrets.TELEPRO_PASS }}
          TELEPRO_COOKIE: ${{ secrets.TELEPRO_COOKIE }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_EMAIL_PASS: ${{ secrets.ALERT_EMAIL_PASS }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_telepro.py
